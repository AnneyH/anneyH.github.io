<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <link rel="stylesheet" href="https://use.typekit.net/lgl7ulp.css">
    <link rel="stylesheet" href="https://use.typekit.net/lgl7ulp.css">
    <title>Illustration Archive</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
  </head>
  <body>
    <div class="newsletter">
      <header>
        <h1><a href="index.html"><img src="logo.svg" alt="Illustration Archive"></a></h1>
        <nav>
          <ul>
            <li><a href="#">Artists</a></li>
            <li><a href="#">Interviews</a></li>
            <li><a href="#">Artwork</a></li>
            <li><a href="#">Techniques</a></li>
            <li><a href="#">Books</a></li>
          </ul>
        </nav>
      </header>
      <main>
        <form>
          <section class="image">
            <h2>Subscribe to our Newsletter!</h2>
            <figure><img src="kimartwork2.jpeg" alt="Kim Jung Gi (2020) Live Drawing of character illustrations on a boat."></figure>
          </section>
          <section class="personal-info">
            <h3>Personal Information</h3>
            <ul>
              <li><label for="name">Name:</label><input type="text" name="name" id="name" placeholder="your full name"></li>
              <li><label for="email">Email:</label><input type="email" name="email" id="email" placeholder="confirmation email"></li>
            </ul>
          </section>
          <section class="interests">
            <h3>Select Your Interests</h3>
            <ul>
              <li><input type="checkbox" id="artist-interviews" value="artist-interviews"><label for="artist-interviews">Artist Interviews</label></li>
              <li><input type="checkbox" id="illustration-tech" value="illustration-tech"><label for="illustration-tech">Illustration Techniques</label></li>
              <li><input type="checkbox" id="art-collection" value="art-collection"><label for="art-collection">Art Collection</label></li>
              <li><input type="checkbox" id="manga-comic" value="manga-comic"><label for="manga-comic">Manga/Comic Illustrations</label></li>
              <li><input type="checkbox" id="industry=spotlight" value="industry-spotlight"><label for="industry-spotlight">Industry Spotlight</label></li>
            </ul>
          </section>
          <section class="subscribe"><button type="subscribe">Subscribe</button></section>
        </form>
      </main>
      <footer>
        <p class="footer"> © All rights reserved. Illustration Archive 2026.</p>
      </footer>
    </div>
  </body>
</html>
